<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>ELL Reading Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:wght@200..1000&display=swap">
<style>
/* Layout: one centered column, one screen at a time (levels → books → question → result → sent) */
:root{
  --bg:#eef5f2; --surface:#ffffff; --ink:#1f3a34; --muted:#5d746e; --line:#d3e3dd;
  --leaf:#2f8f6b; --leaf-ink:#ffffff; --sun:#ffc94a; --sun-soft:#fff4d4;
  --good:#2f8f6b; --bad:#d4553f; --bad-soft:#fde8e4; --good-soft:#e2f4ec; --skip-soft:#e9eeec;
  --orange:#f2841f; --orange-ink:#ffffff; --grey:#d5dcd9; --grey-ink:#33403c;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1c19; --surface:#172a26; --ink:#e4f1ec; --muted:#9db5ae; --line:#2a4540;
  --leaf:#4fc193; --leaf-ink:#0f1c19; --sun:#ffd166; --sun-soft:#3a321b;
  --good:#5fd0a0; --bad:#ff8a73; --bad-soft:#3b211c; --good-soft:#173a2e; --skip-soft:#22332f; --orange:#ff9a3d; --orange-ink:#1f1205; --grey:#33423e; --grey-ink:#e4f1ec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c19; --surface:#172a26; --ink:#e4f1ec; --muted:#9db5ae; --line:#2a4540;
  --leaf:#4fc193; --leaf-ink:#0f1c19; --sun:#ffd166; --sun-soft:#3a321b;
  --good:#5fd0a0; --bad:#ff8a73; --bad-soft:#3b211c; --good-soft:#173a2e; --skip-soft:#22332f; --orange:#ff9a3d; --orange-ink:#1f1205; --grey:#33423e; --grey-ink:#e4f1ec; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.brand .dot{width:34px;height:34px;border-radius:10px;background:var(--leaf);display:grid;place-items:center;color:var(--leaf-ink);font-size:1.1rem}
.level{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;background:var(--sun-soft);color:var(--ink);padding:6px 12px;border-radius:999px;border:1.5px solid var(--sun)}
h1,h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
h2.qtext{font-weight:510}
h1{font-size:1.9rem;line-height:1.2}
h2{font-size:1.45rem;line-height:1.3}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--leaf)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lv{font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.lv:hover:not(:disabled){border-color:var(--leaf)}
.lv .k{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lv .L{font-family:var(--display);font-weight:700;font-size:2.6rem;line-height:1;color:var(--leaf)}
.lv .n{font-size:.85rem;font-weight:700;color:var(--muted)}
.lv:disabled{cursor:default;opacity:.55}
.lv:disabled .L{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.book{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit}
.book:hover{border-color:var(--leaf)}
.cover{flex:none;width:44px;height:56px;border-radius:6px 10px 10px 6px;background:linear-gradient(135deg,var(--leaf),#5fb88f);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:1.15rem;box-shadow:inset 5px 0 0 rgba(0,0,0,.12)}
.book .t{font-family:var(--display);font-weight:600;font-size:1.1rem;line-height:1.25}
.book .m{font-size:.85rem;color:var(--muted)}
.book .go{margin-left:auto;font-weight:800;color:var(--leaf);white-space:nowrap}
.search{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:inherit}
.progress{display:flex;gap:6px}
.progress span{flex:1;height:8px;border-radius:99px;background:var(--line)}
.progress span.done{background:var(--leaf)}
.progress span.now{background:var(--sun)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--sun-soft);border:1.5px solid var(--sun)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-weight:510;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--leaf)}
.opt .lbl{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--leaf);background:var(--good-soft)}
.opt[aria-pressed="true"] .lbl{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.row{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:1.05rem;border-radius:14px;padding:13px 24px;cursor:pointer;border:2px solid transparent}
.btn.primary{background:var(--leaf);color:var(--leaf-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.orange{background:var(--orange);color:var(--orange-ink)}
.btn.grey{background:var(--grey);color:var(--grey-ink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions .btn{padding:16px 12px}
.score-line{font-family:var(--display);font-weight:600;font-size:1.8rem;line-height:1.2}
.score-line b{font-size:2.6rem;color:var(--leaf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:700}
.score .big{font-size:3.6rem;line-height:1;color:var(--leaf)}
.score .of{font-size:1.5rem;color:var(--muted)}
.stars{font-size:1.8rem;letter-spacing:4px;color:var(--sun)}
.stars .off{color:var(--line)}
.review{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.review div{border-radius:12px;padding:8px 4px;text-align:center;font-weight:800;font-size:.9rem}
.review .ok{background:var(--good-soft);color:var(--good)}
.review .no{background:var(--bad-soft);color:var(--bad)}
.review .sk{background:var(--skip-soft);color:var(--muted)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.name{font:inherit;font-family:var(--display);font-weight:600;font-size:1.3rem;padding:18px 10px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:inherit;cursor:pointer}
.name[aria-pressed="true"]{border-color:var(--leaf);background:var(--good-soft)}
.note{font-size:.92rem;border-radius:14px;padding:12px 14px;background:var(--sun-soft);border:1.5px solid var(--sun)}
.note.err{background:var(--bad-soft);border-color:var(--bad)}
pre{margin:0;font-size:.8rem;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;white-space:pre}
.big-check{width:72px;height:72px;border-radius:50%;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-size:2.4rem;font-weight:800}
footer{text-align:center;font-size:.85rem;color:var(--muted)}
@media (max-width:420px){.panel{padding:18px} h1{font-size:1.6rem} .lv .L{font-size:2.1rem}}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <button class="brand" id="homeBtn"><span class="dot">✎</span>ELL Reading</button>
    <span class="level" id="lvTag" hidden></span>
  </header>
  <main id="app"><div class="panel"><p class="muted">Loading…</p></div></main>
  <footer>Finish your book, then answer the questions.</footer>
</div>

<script>
/* ===== SETTINGS ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxt6SHaYY6XdJR-ilbI9T5v4CAG3OjLbPgYCcBZI2cKWdY9m4wtlQY-CGmTX8GzhuCi/exec";
const STUDENTS = ["Edwin", "Sophia"];
// To add a level: upload data/level-g.json (same shape as level-f.json). The button turns on by itself.
const LEVELS = ["F", "G", "I"];

/* ===== APP ===== */
const app = document.getElementById("app"), lvTag = document.getElementById("lvTag");
const DATA = {};           // level -> {level, books} or null
let S = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Sending works on GitHub Pages and local previews. The claude.ai preview blocks outside connections.
const LIVE = /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);

async function loadLevels(){
  await Promise.all(LEVELS.map(async L=>{
    try{ const r=await fetch(`data/level-${L.toLowerCase()}.json`); DATA[L]= r.ok ? await r.json() : null; }
    catch(e){ DATA[L]=null; }
  }));
}

function setTag(L){ lvTag.hidden=!L; lvTag.textContent=L?`Level ${L}`:""; }

function levels(){
  S={}; setTag(null);
  app.innerHTML=`<div class="panel">
    <p class="eyebrow">Guided Reading</p>
    <h1>Choose your level</h1>
    <div class="levels">${LEVELS.map(L=>{const d=DATA[L];return `<button class="lv" data-l="${L}" ${d?"":"disabled"}>
      <span class="k">Level</span><span class="L">${L}</span>
      <span class="n">${d?`${d.books.length} books`:"Coming soon"}</span></button>`}).join("")}</div>
  </div>`;
  app.querySelectorAll(".lv").forEach(el=>el.onclick=()=>books(el.dataset.l));
}

function books(L, filter=""){
  S={level:L}; setTag(L);
  const all=DATA[L].books, f=filter.trim().toLowerCase();
  const shown=all.map((b,i)=>({b,i})).filter(x=>!f||x.b.title.toLowerCase().includes(f));
  app.innerHTML=`<div class="panel">
    <h1>Which book did you read?</h1>
    <input class="search" id="q" type="search" placeholder="Type the book title" value="${esc(filter)}" aria-label="Find a book">
    <div class="list">${shown.length?shown.map(({b,i})=>`<button class="book" data-i="${i}">
      <span class="cover">${esc(b.title[0])}</span>
      <span><span class="t">${esc(b.title)}</span><br><span class="m">${b.questions.length} questions</span></span>
      <span class="go">Start →</span></button>`).join(""):`<p class="muted">No book matches “${esc(filter)}”.</p>`}</div>
    <div class="row"><button class="btn ghost" id="back">← Levels</button></div>
  </div>`;
  const q=document.getElementById("q");
  q.oninput=()=>{const v=q.value; books(L,v); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(v.length,v.length);};
  app.querySelectorAll(".book").forEach(el=>el.onclick=()=>{S={level:L,book:all[+el.dataset.i],q:0,picks:{}};question();});
  document.getElementById("back").onclick=levels;
}

function question(){
  const b=S.book, q=b.questions[S.q], pick=S.picks[q.number], last=S.q===b.questions.length-1;
  const canGo = pick || q.optional;
  app.innerHTML=`<div class="panel">
    <div class="progress">${b.questions.map((_,i)=>`<span class="${i<S.q?'done':i===S.q?'now':''}"></span>`).join("")}</div>
    <div class="qhead"><p class="qnum">${esc(b.title)} · Question ${S.q+1} of ${b.questions.length}</p>${q.optional?'<span class="tag">Optional</span>':''}</div>
    <h2 class="qtext">${esc(q.question)}</h2>
    ${q.optional?'<p class="muted">You can answer this one or skip it. It does not change your score.</p>':''}
    <div class="opts">${q.options.map(o=>`<button class="opt" data-l="${o.label}" aria-pressed="${pick===o.label}">
      <span class="lbl">${o.label}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
    <div class="row">
      <button class="btn ghost" id="back">${S.q===0?"← Books":"← Back"}</button>
      <button class="btn primary" id="next" ${canGo?"":"disabled"}>${!pick&&q.optional?(last?"Skip & finish":"Skip →"):(last?"Finish":"Next →")}</button>
    </div></div>`;
  app.querySelectorAll(".opt").forEach(el=>el.onclick=()=>{S.picks[q.number]=S.picks[q.number]===el.dataset.l&&q.optional?undefined:el.dataset.l;question();});
  document.getElementById("back").onclick=()=>{ if(S.q===0) books(S.level); else {S.q--;question();} };
  document.getElementById("next").onclick=()=>{ if(last) result(); else {S.q++;question();} };
}

function scored(){ return S.book.questions.filter(q=>!q.optional); }

function result(){
  const qs=S.book.questions, req=scored();
  S.score=req.filter(q=>S.picks[q.number]===q.answer).length;
  const stars=Math.round(S.score/req.length*5);
  app.innerHTML=`<div class="panel">
    <h1>Great reading!</h1>
    <p class="score-line">Score: <b>${S.score}</b> out of ${req.length}</p>
    <div class="stars" aria-label="${stars} of 5 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(5-stars)}</span></div>
    <div class="review">${qs.map(q=>{const p=S.picks[q.number];
      if(q.optional) return `<div class="sk">${q.number} ${p?'✎':'–'}</div>`;
      const ok=p===q.answer;return `<div class="${ok?'ok':'no'}">${q.number} ${ok?'✓':'✗'}</div>`}).join("")}</div>
    ${qs.some(q=>q.optional)?'<p class="muted">Grey boxes are optional questions.</p>':''}
  </div>
  <div class="panel">
    <h2>Who are you?</h2>
    <div class="names">${STUDENTS.map(n=>`<button class="name" data-n="${n}" aria-pressed="${S.student===n}">${n}</button>`).join("")}</div>
    <div class="actions">
      <button class="btn orange" id="send" ${S.student?"":"disabled"}>Send to teacher</button>
      <button class="btn grey" id="again">Answer again</button>
    </div>
    ${S.student?"":'<p class="muted">Tap your name first, then send.</p>'}
    <div id="msg"></div>
  </div>`;
  app.querySelectorAll(".name").forEach(el=>el.onclick=()=>{S.student=el.dataset.n;result();});
  document.getElementById("send").onclick=send;
  document.getElementById("again").onclick=()=>{S.picks={};S.q=0;S.score=undefined;question();};
}

function payload(){
  const d=new Date(), qs=S.book.questions;
  return {
    timestamp:d.toISOString(),
    month:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,
    student:S.student, level:S.level,
    bookId:S.book.book_id, bookTitle:S.book.title,
    score:S.score, total:scored().length,
    answers:qs.map(q=>{const p=S.picks[q.number]||"-";
      return q.optional?`${q.number}:${p}(opt)`:`${q.number}:${p}${p===q.answer?"✓":"✗"}`}).join(" ")
  };
}

async function send(){
  const btn=document.getElementById("send"), msg=document.getElementById("msg"), p=payload();
  btn.disabled=true; btn.textContent="Sending…";
  if(!LIVE){
    msg.innerHTML=`<p class="note">Preview: this page can’t reach Google from here. On the GitHub site, this row goes to your Google Sheet:</p><pre>${esc(JSON.stringify(p,null,2))}</pre>`;
    btn.textContent="Preview only"; return;
  }
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)});
    sent(p);
  }catch(e){
    btn.disabled=false; btn.textContent="Try again";
    msg.innerHTML=`<p class="note err">Your score did not send. Check the internet and tap Try again.</p>`;
  }
}

function sent(p){
  app.innerHTML=`<div class="panel" style="align-items:center;text-align:center">
    <div class="big-check">✓</div>
    <h1>Sent, ${esc(p.student)}!</h1>
    <p class="muted">${esc(p.bookTitle)} · ${p.score} / ${p.total}</p>
    <button class="btn primary" id="again">Read another book</button></div>`;
  document.getElementById("again").onclick=levels;
}

document.getElementById("homeBtn").onclick=levels;
loadLevels().then(levels);
</script>

</body>
</html>
